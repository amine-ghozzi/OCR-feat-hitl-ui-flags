# Golden corpus manifest — the authority on which documents the regression gate covers
# and which of them are non-public (decision G-2 / GOV-3).
#
# doc_id   the stable id `tools/extraction_benchmark/config.case_id()` derives from the
#          FILE NAME. Both copies of "EF CLB 2024 Provisoire (1).pdf" slugify to the
#          same id, which is one more reason only one of them is listed.
# path     repo-relative, forward slashes, so a snapshot taken on Windows compares
#          byte-for-byte against one taken in the container.
# public   false for the five client financial statements. Sessions may read counts and
#          page numbers for those, never values, labels or text, and no external-AI
#          stage may be pointed at them. `compare` keeps their field-level detail off
#          stdout and writes it to the gitignored diffs/ directory instead.
# unstable documents whose record is known to vary between two identical runs. None so
#          far — the flag exists so a genuinely non-deterministic document can be
#          recorded as such rather than quietly weakening the whole gate.
#
# 17 files live under Samples/; `Samples/EF CLB 2024 Provisoire (1).pdf` is BYTE-IDENTICAL
# to the copy under `Samples/Sample - OF/`, so only the `Sample - OF` copy is listed.
# 16 documents: 11 public, 5 non-public.

