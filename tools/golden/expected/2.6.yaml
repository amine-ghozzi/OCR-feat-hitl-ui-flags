# WP-2.6 — newline preservation in smart_correct (OCR-13) + deterministic text (OCR-15)
#
# `smart_correct` runs over the WHOLE markdown document, split the text on whitespace
# and re-joined the tokens with single spaces: every newline in `ExtractionResult.text`
# collapsed and both tiers emitted one long line (OCR-13). It now re-joins the original
# whitespace runs, so the line structure of the extracted text survives. Separately,
# `Vocabulary` iterated the vocabulary SET, which ordered `by_length` — the list
# `fuzzy_match` scans first-best-wins — by Python's randomised string hash: a fuzzy tie
# resolved to a different word in every process, so the same code gave a different
# `text_sha` unless the seed was pinned (OCR-15). The iteration is sorted now, which
# fixes ONE order for every process — not necessarily the order PYTHONHASHSEED=0 gave
# the baseline, so a tie may land on a different vocabulary word than it used to.
#
# What may therefore move, on ANY document (the post-processor runs on all of them):
#   text_sha    every document's text changes: the newlines are back (OCR-13), and a
#               fuzzy tie may resolve to a different word than the baseline's seed did
#   text_chars  the whitespace runs are no longer collapsed to one space each, so the
#               character count rises on every document that had any
#   qcs         within tolerance only (see below)
#
# `qcs` is NOT declared per-document: the heuristic layer reads `text` (qcs/calculator.py
# :262) and the correction counts move by a word or two where a fuzzy tie resolved
# differently, so the score may drift a little in EITHER direction. 0.02 is the whole
# budget — a larger move is a real change in what was read, not a re-tie, and fails.
#
# Everything else has NO rule on purpose: statements, checks, table_count, table_shapes,
# tier, hitl_required, green_flag_*, quarantined, canonical_count, routing_reason, … must
# be identical — on 15 of the 16 documents they are, measured. The exception is declared
# per-document below and nowhere else.

change: WP-2.6 — newline preservation in smart_correct (OCR-13) + deterministic post-processed text (OCR-15)

tolerance:
  qcs: 0.02

docs:
  "*":
    text_sha: any
    text_chars: any

  # The ONLY document whose structure moves, and only because equidistant fuzzy
  # ties now resolve deterministically instead of by hash-seed accident (OCR-15).
  # Measured, exactly:
  #   statements  2 of 62 move, both with near-zero match rates:
  #                 [5]  qualified_type compte_resultat -> bilan_actif,
  #                      match_rate 0.045 -> 0.091
  #                 [31] match_rate 0.037 -> 0.0
  #               statement count stays 62; no gate flips; quarantined stays 10.
  #   checks      total 249 -> 248, passed 143 -> 142 — one fewer check RUN because
  #               [5] is now typed as a bilan_actif. failed stays 104, critical 2.
  #   ensemble    conflict_count 168 -> 167.
  # tier, hitl_required, table_count, table_shapes, quarantined and the green_flag_*
  # fields are NOT whitelisted here: they were measured unchanged and must stay so.
  #
  # Why this ships rather than being tuned away: the baseline's tie winners were
  # themselves accidents of PYTHONHASHSEED=0, so EVERY deterministic policy differs
  # from it somewhere. Two alternatives were measured on this document and are worse
  # (ranked first-char/length/lexicographic: 6 statements move, one gate flips to
  # quarantined; refusing an ambiguous correction: 27 statements move, nine gates
  # flip). Choosing between them on structural-diff counts would be calibrating
  # without ground truth, so the tie-break policy — and the observation that the tie
  # set is dominated by 1-3 letter function words that arguably should not be
  # fuzzy-match targets at all — is deferred to P6/P7 (MEA-3 labelled set, MEA-7
  # calibration). These two statements are re-classified in P4 regardless.
  ciments_bizerte_efi300625.pdf:
    text_sha: any
    text_chars: any
    statements: any
    checks: any
    ensemble: any
